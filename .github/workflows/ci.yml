name: ci
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions: {contents: read}
jobs:
  archive-schema:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: collector_test, POSTGRES_USER: collector_test, POSTGRES_PASSWORD: local-test-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U collector_test -d collector_test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgres://collector_test:local-test-only@localhost:5432/collector_test?sslmode=disable
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version: '1.27.1', cache: true, cache-dependency-path: '**/go.sum'}
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/migrations/001_foundation.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE ROLE collector_query; CREATE ROLE collector_worker;'
      - run: go run ./shared/cmd/migrate && go run ./shared/cmd/migrate
      - run: test "$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c "SELECT name FROM collector_app_migrations WHERE name='007_public_chat_archive.sql' AND EXISTS (SELECT 1 FROM pg_class WHERE relname='archive_segments')")" = 007_public_chat_archive.sql
      - run: >-
          test "$(psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 -c
          "SELECT has_table_privilege('collector_query','archive_segments','SELECT')
          AND NOT has_table_privilege('collector_query','archive_segments','INSERT')
          AND has_table_privilege('collector_worker','archive_segments','INSERT')
          AND has_sequence_privilege('collector_worker','archive_segments_segment_id_seq','USAGE')")" = t
      - name: Verify dedicated public database role
        run: |
          admin_file=$(mktemp)
          public_file=$(mktemp)
          trap 'rm -f "$admin_file" "$public_file"' EXIT
          printf 'local-test-only' > "$admin_file"
          printf 'local-public-password-32-bytes-minimum' > "$public_file"
          chmod 0400 "$admin_file" "$public_file"
          PGHOST=localhost POSTGRES_ADMIN_USER=collector_test POSTGRES_DB=collector_test \
            POSTGRES_ADMIN_PASSWORD_FILE="$admin_file" PUBLIC_API_PASSWORD_FILE="$public_file" \
            ./deploy/provision-public-api-role.sh
          test "$(PGPASSWORD=local-public-password-32-bytes-minimum psql -h localhost -U collector_public_api -d collector_test -At -v ON_ERROR_STOP=1 -c \
            "SELECT has_table_privilege(current_user,'archive_chat_hot','SELECT') AND NOT has_table_privilege(current_user,'archive_chat_hot','INSERT') AND NOT has_table_privilege(current_user,'collector_channels','INSERT')")" = t
      - run: COLLECTOR_TEST_DATABASE_URL="$DATABASE_URL" go test ./shared/store -run '^TestArchiveChatSessionAndReplay$' -count=1
      - run: COLLECTOR_TEST_DATABASE_URL="$DATABASE_URL" go test ./query/archive -run '^TestArchiveExportPreservesDedupIndex$' -count=1
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with: {go-version: '1.27.1', cache: true, cache-dependency-path: '**/go.sum'}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: {node-version: 22.22.0, cache: npm}
      - name: Verify cookie component and certificate renewal
        run: |
          python3 -m venv /tmp/collector-cookie-tests
          /tmp/collector-cookie-tests/bin/pip install -r cookie-auth/requirements.txt
          /tmp/collector-cookie-tests/bin/python -m unittest discover -s cookie-auth
          python3 tools/ops/test_rotate_server_tls.py
          make source-check
      - run: npm ci
      - run: make test
      - run: make build
      - run: ./tools/ops/test.sh
      - run: python3 tools/ops/test_fetch_release.py && python3 tools/ops/test_load_secrets_aws.py && python3 tools/ops/test_upload_backup_s3.py

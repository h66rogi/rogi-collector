name: private-deploy
on:
  workflow_run:
    workflows: [release]
    types: [completed]
permissions:
  contents: read
  packages: read
  id-token: write
concurrency:
  group: production-private-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Assume production deploy role
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2
          mask-aws-account-id: true
      - name: Supply short-lived registry token and wait for SSM deployment
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_SECRET_ARN: ${{ secrets.AWS_REGISTRY_SECRET_ARN }}
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          SSM_DOCUMENT: ${{ secrets.AWS_SSM_DOCUMENT_NAME }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          credentials_file=$(mktemp)
          chmod 0600 "$credentials_file"
          cleanup_registry_secret() {
            original_status=$?
            trap - EXIT
            jq -cn '{username:"",token:""}' >"$credentials_file"
            if ! aws secretsmanager put-secret-value --secret-id "$REGISTRY_SECRET_ARN" --secret-string "file://$credentials_file" >/dev/null 2>&1; then
              rm -f "$credentials_file"
              exit 1
            fi
            rm -f "$credentials_file"
            exit "$original_status"
          }
          trap cleanup_registry_secret EXIT
          jq -cn --arg username "$REGISTRY_USERNAME" --arg token "$GH_PACKAGES_TOKEN" '{username:$username,token:$token}' >"$credentials_file"
          aws secretsmanager put-secret-value --secret-id "$REGISTRY_SECRET_ARN" --secret-string "file://$credentials_file" >/dev/null
          printf '{"username":"","token":""}' >"$credentials_file"
          unset GH_PACKAGES_TOKEN
          command_id=$(aws ssm send-command --document-name "$SSM_DOCUMENT" --instance-ids "$INSTANCE_ID" --query 'Command.CommandId' --output text)
          status=Pending
          for attempt in $(seq 1 90); do
            status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || printf Pending)
            case "$status" in Success) break;; Pending|InProgress|Delayed) sleep 10;; *) exit 1;; esac
          done
          test "$status" = Success
          invocation=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent}' --output json)
          jq -e --arg sha "$SOURCE_SHA" '.Status == "Success" and (.Output | fromjson | .receipt.sourceSha == $sha)' <<<"$invocation" >/dev/null
          unset invocation

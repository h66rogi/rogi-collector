name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-role: &role
  init: true
  restart: "no"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  mem_limit: 256m
  cpus: 0.50
  tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777"]
  networks: [data]
  logging: *logging
  healthcheck:
    test: [CMD, /healthcheck]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 5s

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set immutable POSTGRES_IMAGE digest}
    restart: "no"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.00
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
      POSTGRES_MIGRATE_USER: ${POSTGRES_MIGRATE_USER:?set POSTGRES_MIGRATE_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-admin-password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - {type: bind, source: "${DATA_ROOT:?set DATA_ROOT}/postgres", target: /var/lib/postgresql/data, bind: {create_host_path: false}}
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/postgres-admin-password", target: /run/secrets/postgres-admin-password, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/postgres-migrate-password", target: /run/secrets/postgres-migrate-password, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${RELEASE_ROOT:?set RELEASE_ROOT}/deploy/initdb", target: /docker-entrypoint-initdb.d, read_only: true, bind: {create_host_path: false}}
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777", "/run/postgresql:rw,noexec,nosuid,nodev,size=16777216,uid=70,gid=70"]
    networks: [data]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 24
  redis:
    image: ${REDIS_IMAGE:?set immutable REDIS_IMAGE digest}
    restart: "no"
    user: "999:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.50
    command: [sh, -ec, 'exec redis-server --appendonly yes --dir /data --requirepass "$$(cat /run/secrets/redis-password)"']
    volumes:
      - {type: bind, source: "${DATA_ROOT:?set DATA_ROOT}/redis", target: /data, bind: {create_host_path: false}}
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/redis-password", target: /run/secrets/redis-password, read_only: true, bind: {create_host_path: false}}
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777"]
    networks: [data]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis-password)" ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 24
  migrate:
    image: ${POSTGRES_IMAGE:?set immutable POSTGRES_IMAGE digest}
    restart: "no"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB}
      PGUSER: ${POSTGRES_MIGRATE_USER:?set POSTGRES_MIGRATE_USER}
      PGPASSFILE: /run/secrets/pgpass
    command: [/release/run-migrations.sh]
    volumes:
      - {type: bind, source: "${RELEASE_ROOT:?set RELEASE_ROOT}/deploy/migrations", target: /release/migrations, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${RELEASE_ROOT:?set RELEASE_ROOT}/deploy/run-migrations.sh", target: /release/run-migrations.sh, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/migrate.pgpass", target: /run/secrets/pgpass, read_only: true, bind: {create_host_path: false}}
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=16777216,mode=1777"]
    depends_on: {postgres: {condition: service_healthy}}
    networks: [data]
    logging: *logging
  app-migrate:
    <<: *role
    image: ${QUERY_IMAGE:?required}
    entrypoint: [/migrate]
    healthcheck: {disable: true}
    volumes: [{type: bind, source: "${SECRETS_ROOT}/app-migrate.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}]
  provision-public-api-role:
    image: ${POSTGRES_IMAGE:?set immutable POSTGRES_IMAGE digest}
    restart: "no"
    user: "70:70"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER}
    command: [/release/provision-public-api-role.sh]
    volumes:
      - {type: bind, source: "${RELEASE_ROOT:?set RELEASE_ROOT}/deploy/provision-public-api-role.sh", target: /release/provision-public-api-role.sh, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/postgres-admin-password", target: /run/secrets/postgres-admin-password, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/public-api-db-password", target: /run/secrets/public-api-db-password, read_only: true, bind: {create_host_path: false}}
    depends_on: {postgres: {condition: service_healthy}}
    networks: [data]
    logging: *logging
  discover:
    <<: *role
    image: ${DISCOVER_IMAGE:?set immutable DISCOVER_IMAGE digest}
    environment: {PROBE_ADDR: "0.0.0.0:8080"}
    networks: [data, egress]
    volumes:
      - {type: bind, source: "${SECRETS_ROOT}/discover.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${DATA_ROOT}/cookies", target: /cookies, read_only: true, bind: {create_host_path: false}}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  coordinator:
    <<: *role
    image: ${COORDINATOR_IMAGE:?set immutable COORDINATOR_IMAGE digest}
    volumes: [{type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/coordinator.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  worker:
    <<: *role
    image: ${WORKER_IMAGE:?set immutable WORKER_IMAGE digest}
    environment: {PROBE_ADDR: "0.0.0.0:8080"}
    networks: [data, egress]
    volumes:
      - {type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/worker.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${DATA_ROOT}/cookies", target: /cookies, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${DATA_ROOT:?set DATA_ROOT}/spool", target: /srv/rogi-collector/spool, bind: {create_host_path: false}}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
  query:
    <<: *role
    image: ${QUERY_IMAGE:?set immutable QUERY_IMAGE digest}
    volumes:
      - {type: bind, source: "${SECRETS_ROOT}/query.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${DATA_ROOT}/tls", target: /tls, read_only: true, bind: {create_host_path: false}}
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [data, egress]
    ports: ["${QUERY_BIND_IP:?private IP required}:7443:7443"]

  data-api:
    <<: *role
    image: ${QUERY_IMAGE:?set immutable QUERY_IMAGE digest}
    entrypoint: [/data-api]
    volumes: [{type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/data-api.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}]
    networks: [data, egress]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}

  archive-exporter:
    <<: *role
    image: ${QUERY_IMAGE:?set immutable QUERY_IMAGE digest}
    entrypoint: [/archive-exporter]
    volumes: [{type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/archive-exporter.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}]
    networks: [data, egress]
    depends_on: {postgres: {condition: service_healthy}}

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:?set immutable CLOUDFLARED_IMAGE digest}
    init: true
    restart: "no"
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    cpus: 0.50
    command: [tunnel, --no-autoupdate, run, --token-file, /run/secrets/tunnel-token]
    volumes: [{type: bind, source: "${SECRETS_ROOT:?set SECRETS_ROOT}/tunnel-token", target: /run/secrets/tunnel-token, read_only: true, bind: {create_host_path: false}}]
    networks: [data, egress]
    depends_on: {data-api: {condition: service_healthy}}
    logging: *logging

  cookie-auth:
    image: ${COOKIE_AUTH_IMAGE:?required}
    init: true
    restart: "no"
    user: "65532:65532"
    read_only: true
    security_opt: [seccomp:unconfined, apparmor:rogi-collector-cookie-auth]
    mem_limit: 1400m
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    tmpfs: ["/tmp:rw,nosuid,nodev,size=268435456,mode=1777", "/home/collector:rw,nosuid,nodev,size=67108864,uid=65532,gid=65532"]
    environment: {ROLE_ENV_FILE: /run/secrets/role.env, SOOP_COOKIE_FILE: /cookies/cookies.json, SOOP_COOKIE_BIND: 0.0.0.0}
    volumes:
      - {type: bind, source: "${SECRETS_ROOT}/cookie-auth.env", target: /run/secrets/role.env, read_only: true, bind: {create_host_path: false}}
      - {type: bind, source: "${DATA_ROOT}/cookies", target: /cookies, bind: {create_host_path: false}}
    networks: [egress]
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/healthz', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 12
      start_period: 120s
networks:
  data: {internal: true}
  egress: {}
